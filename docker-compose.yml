# Local infrastructure for development: PostgreSQL + Redis.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veyvo
      POSTGRES_PASSWORD: veyvo
      POSTGRES_DB: veyvo
    ports:
      - "5432:5432"
    volumes:
      - veyvo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyvo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  veyvo_pg:
